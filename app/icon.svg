<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1d4ed8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fondo redondeado con gradiente azul -->
  <rect width="64" height="64" rx="16" fill="url(#blueGrad)" />

  <!-- Icono de micrófono en blanco -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Cápsula central del micrófono -->
    <rect x="24" y="12" width="16" height="26" rx="8" />

    <!-- Ranuras estéticas de la rejilla -->
    <line x1="28" y1="20" x2="36" y2="20" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" />
    <line x1="28" y1="25" x2="36" y2="25" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" />

    <!-- Soporte curvo alrededor del micrófono -->
    <path d="M17 26 c0 9 6.5 15 15 15 s15 -6 15 -15" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

    <!-- Pie y base -->
    <line x1="32" y1="41" x2="32" y2="49" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="22" y1="49" x2="42" y2="49" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
